[project]
name = "protolstm-weight-adjustment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "pandas>=2.2.3",
    "pydot>=3.0.4",
    "safetensors>=0.5.3",
    "scikit-learn>=1.6.1",
    "tf-nightly>=2.20.0.dev20250413",
]

[project.optional-dependencies]
nb = [
    "marimo>=0.12.10",
    "google-generativeai>=0.8.5",
    "matplotlib>=3.10.3",
]

[dependency-groups]
dev = [
    "fastapi-sitemap>=1.0.4",
    "pytest>=8.3.5",
]

[tool.pdm]
python.use_venv = true

[tool.pdm.dev-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
